# v2.6.27: the YouTube JS-challenge solver needs a JS runtime.
# yt-dlp's remote_components ejs:github (see bot.py) runs with Deno by
# default (yt-dlp's js_runtimes default is {"deno": {}}).
# WARNING (learned 2026-11-15, build d47693b2): a [phases.setup] in this
# file REPLACES the Python provider's setup phase — it does NOT append
# to it. Listing only "deno" removed Python entirely and the build died
# with "python: command not found". So Python 3.9 (the version the
# service runs — NIXPACKS_PYTHON_VERSION=3.9, for pytgcalls voice) must
# be listed here too, exactly as the provider would install it.
[phases.setup]
nixPkgs = ["python39", "deno"]

# v2.6.30: yt-dlp runs as a STANDALONE BINARY (the bot stays on Python
# 3.9 for pytgcalls voice, and yt-dlp >= 2025.10.15 needs Python >= 3.10,
# so the bot cannot import it as a library). The binary is the official
# yt-dlp_linux release (2026.10.26, embeds its own Python 3.12+),
# pinned — "latest" is deliberately NOT used, so a build never silently
# changes version. It lands in the app dir next to bot.py, where
# bot.py's _ytdlp_bin() finds it. A custom phase runs after the
# provider's install phase (dependsOn); it replaces nothing.
[phases.fetch-ytdlp]
dependsOn = ["install"]
cmds = ["curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux -o yt-dlp", "chmod +x yt-dlp"]
